aid: celltype
name: Celltype
description: >-
  CellType is an AI-driven drug discovery company building what it calls "The
  Biological World Model" — foundation models and autonomous agents that
  simulate human biology to predict drug responses in human systems before
  clinical trials, reducing reliance on traditional preclinical models such as
  mice and cell lines. Its core technology, Cell2Sentence (C2S), teaches large
  language models to understand cellular biology by converting single-cell gene
  expression data into a text-like format that models can interpret, and the
  company reports using it to discover and validate a novel cancer treatment
  signal targeting tumor immunogenicity. A Y Combinator (Winter 2026) company
  based in New York City, CellType works with large pharmaceutical partners and
  currently operates as a B2B research and drug-discovery platform rather than
  a public developer API.
